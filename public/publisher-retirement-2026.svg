<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Publisher Retirement 2026</title>
  <desc id="desc">A PUB document moves toward PDF and InDesign-ready files before an October 2026 deadline.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020814"/>
      <stop offset="1" stop-color="#101b2d"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#aa7d48" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#background)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <path d="M0 755L1600 565V1000H0Z" fill="#faf8f5"/>
  <path d="M0 755L1600 565" stroke="#aa7d48" stroke-width="7"/>

  <text x="110" y="145" fill="#aa7d48" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="8">PRESSMARK STUDIO • PUBLICATION PRODUCTION</text>
  <text x="110" y="265" fill="#fff" font-family="Georgia, serif" font-size="96" font-weight="700">Publisher Retirement</text>
  <text x="110" y="360" fill="#fff" font-family="Georgia, serif" font-size="96" font-weight="700">2026</text>
  <text x="114" y="423" fill="#c9d1de" font-family="Arial, sans-serif" font-size="30">Preserve the files. Rebuild the workflow.</text>

  <g transform="translate(115 530)" filter="url(#shadow)">
    <path d="M0 0h220l80 80v285H0z" fill="#fff"/>
    <path d="M220 0v80h80" fill="#e8e4dd"/>
    <rect x="35" y="222" width="230" height="94" fill="#aa7d48"/>
    <text x="150" y="284" fill="#020814" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="800">.PUB</text>
  </g>

  <g fill="none" stroke="#aa7d48" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 705h250"/>
    <path d="M670 650l55 55-55 55"/>
  </g>

  <g transform="translate(775 600)" filter="url(#shadow)">
    <path d="M0 0h190l64 64v245H0z" fill="#fff"/>
    <path d="M190 0v64h64" fill="#e8e4dd"/>
    <text x="127" y="200" fill="#020814" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="800">PDF</text>
  </g>
  <g transform="translate(1080 565)" filter="url(#shadow)">
    <path d="M0 0h220l74 74v275H0z" fill="#020814" stroke="#aa7d48" stroke-width="5"/>
    <path d="M220 0v74h74" fill="#aa7d48"/>
    <text x="147" y="206" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800">INDESIGN</text>
    <text x="147" y="252" fill="#aa7d48" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">READY</text>
  </g>

  <g transform="translate(1115 110)">
    <rect width="365" height="290" rx="10" fill="#faf8f5" filter="url(#shadow)"/>
    <rect width="365" height="72" rx="10" fill="#aa7d48"/>
    <rect y="62" width="365" height="10" fill="#aa7d48"/>
    <text x="182.5" y="48" fill="#020814" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="4">DEADLINE</text>
    <text x="182.5" y="157" fill="#020814" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="700">OCTOBER</text>
    <text x="182.5" y="238" fill="#aa7d48" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="800">2026</text>
  </g>
</svg>
